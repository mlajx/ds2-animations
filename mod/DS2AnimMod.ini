; DS2AnimMod settings (place next to DarkSoulsII.exe)

[General]
; 1 = write DS2AnimMod.log next to the exe
Log=1

[SteamFix]
; stuttering fix: skips re-storing already unlocked achievements, throttles stats requests,
; deduplicates leaked Steam callbacks
Enabled=1

[AnimLoader]
; files in this folder replace the archived game files with the same path,
; e.g. DS2AnimMod\morpheme4\chr\c0001.anibnd.dcx
Enabled=1
Folder=DS2AnimMod
